name: Deploy Gen3D Inspector to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'gen3d-inspector/**'
      - '.github/workflows/deploy-gen3d-inspector.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gen3d-inspector-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gen3d-inspector
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gen3d-inspector/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static GitHub Pages bundle
        run: npm run build:github-pages
      - name: Verify generated bundle
        run: npm run verify:github-pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: gen3d-inspector/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
